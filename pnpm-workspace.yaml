packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@apollo/protobufjs': true
  # postinstall only prints a sponsor message; nothing to build.
  browser-tabs-lock: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - mongoose@9.8.1

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - unrs-resolver
