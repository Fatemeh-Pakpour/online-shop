<!doctype html>
<html lang="en">

<head>
  <!-- sets the character encoding. It tells the browser how to read text characters. UTF-8 supports most languages and symbols. This should usually be near the top of -->
  <meta charset="UTF-8" />
  <!-- is very important for responsive design. It tells mobile browsers: Start zoom at 1.-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Shop</title>
</head>

<body>
  <!-- the order is important So the <div id="root"> must exist before the script runs. -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
